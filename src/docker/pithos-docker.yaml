# Lima descriptor for `pithos-docker`, the isolated Docker daemon `pithos --docker`
# hands to Pi. Pithos creates the VM from this embedded copy on first use.
# Nothing from the host is mounted. dockerd also listens on tcp://0.0.0.0:2375
# inside the VM, reachable only from the Mac and its containers via the VM's
# vzNAT address. Verified with Lima 2.2.1 on macOS 26 (Apple silicon).
base: template:_images/ubuntu-lts
vmType: vz
cpus: 8
memory: "8GiB"
disk: "40GiB"
mounts: []
networks:
  # A fixed MAC keeps the DHCP lease, so the address survives restarts. Any
  # locally administered MAC works; change it only if it collides with another VM.
  - vzNAT: true
    macAddress: "52:55:55:46:97:91"
# Nothing is forwarded to the Mac's loopback: Pi and Pithos reach the daemon and
# every published port directly on the vzNAT address (`lima0` in the guest).
portForwards:
  - guestIP: "0.0.0.0"
    guestPortRange: [1, 65535]
    ignore: true
  - guestIP: "::"
    guestPortRange: [1, 65535]
    ignore: true
  - guestPortRange: [1, 65535]
    ignore: true
provision:
  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail
      export DEBIAN_FRONTEND=noninteractive
      if ! command -v docker >/dev/null 2>&1; then
        curl -fsSL https://get.docker.com | sh
      fi
      mkdir -p /etc/systemd/system/docker.service.d
      cat >/etc/systemd/system/docker.service.d/tcp.conf <<'EOF'
      [Service]
      ExecStart=
      ExecStart=/usr/bin/dockerd -H fd:// -H tcp://0.0.0.0:2375 --containerd=/run/containerd/containerd.sock
      EOF
      systemctl daemon-reload
      systemctl enable --now docker
      systemctl restart docker
probes:
  - description: "dockerd answers on tcp 2375"
    script: |
      #!/bin/bash
      set -eux -o pipefail
      if ! timeout 120s bash -c "until curl -fsS http://127.0.0.1:2375/_ping >/dev/null 2>&1; do sleep 3; done"; then
        echo >&2 "dockerd tcp is not ready"
        exit 1
      fi
    hint: "docker did not come up; see /var/log/cloud-init-output.log in the guest"
