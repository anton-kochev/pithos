[package]
name = "pithos"
version = "0.20.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
ctrlc = "3"
fs2 = "=0.4.3"
getrandom = "0.4"
saphyr = "=0.0.6"
saphyr-parser = "=0.0.6"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.11.0"
tempfile = "3"
thiserror = "2"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"

[[bin]]
name = "pithos"
path = "src/main.rs"

[target."cfg(unix)".dependencies]
libc = "=0.2.185"
signal-hook = "=0.3.18"
